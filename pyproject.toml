[project]
name = "routellm"
version = "0.1.0"
description = "Generate and verbalize route contexts using LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.12.14",
    "click>=8.2.1",
    "geopandas>=1.1.1",
    "mapbox-vector-tile>=2.2.0",
    "numpy>=2.3.1",
    "openai>=1.96.1",
    "osmnx>=2.0.5",
    "pandas>=2.3.1",
    "pyproj>=3.7.1",
    "shapely>=2.1.1",
    "timezonefinder>=6.5.9",
    "tqdm>=4.67.1",
]

[project.scripts]
routellm = "routellm.run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routellm"]

[dependency-groups]
dev = [
    "pip>=25.1.1",
    "pyright>=1.1.403",
    "ruff>=0.12.4",
]

[tool.pyright]
include = ["src/routellm"]
struct = true
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = [
  "D",
  "ARG",
  'E',
  'F',
  'W',
  'A',
  'PLC',
  'PLE',
  'PLW',
  'I',
] # D for docstring conventions, ARG for undocumented arguments.
ignore = ["D212", "D203"]
fixable = ["ALL"]
unfixable = []